<!DOCTYPE html>
<html>
<head>
    <title>Req HTTP CyberPi</title>
</head>
<body style="margin:0;display:flex;flex-direction:column;height:100vh;">

<textarea id="txt" maxlength="100" style="flex:1;font-size:20px;"></textarea>

<button onclick="send()" style="height:60px;">Envoyer</button>
<button onclick="clearTxt()" style="height:60px;">Effacer</button>

<script>
const DB_URL = "https://req-http-cyberpi-default-rtdb.firebaseio.com";

function send() {
  let text = document.getElementById("txt").value;

  fetch(DB_URL + "/message.json", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ msg: text })
  })
  .then(() => alert("Envoyé !"))
  .catch(e => alert("Erreur : " + e));
}

function clearTxt() {
  document.getElementById("txt").value = "";
}
</script>

</body>
</html>
